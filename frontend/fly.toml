app = "tuba-team-frontend"
primary_region = "jnb"

[build]
  [build.args]
    REACT_APP_API_URL = "https://tuba-team-backend.fly.dev/api"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
