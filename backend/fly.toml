app = "tuba-team-backend"
primary_region = "jnb"   # Johannesburg — closest free region to Ethiopia

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume — keeps your database and uploaded photos safe
[[mounts]]
  source = "tuba_data"
  destination = "/data"
  initial_size = "1gb"
